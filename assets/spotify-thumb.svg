<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Spotify music graph model in Neo4j</title><desc id="d">Track nodes connect to Artist through PERFORMED_BY, to Album through BELONGS_TO, and to Genre through HAS_GENRE. The project ran seven Cypher query tasks with ten runtime trials each.</desc><rect width="900" height="520" fill="#f3f1eb"/><g font-family="Arial, Helvetica, sans-serif" fill="#19201c"><text x="38" y="38" font-size="12" font-weight="700" letter-spacing="2" fill="#315f55">SPOTIFY MUSIC GRAPH · NEO4J</text><text x="38" y="84" font-size="35" font-weight="700" letter-spacing="-1">From records to relationships.</text><text x="38" y="115" font-size="18" fill="#535e56">Python preparation · graph model · Cypher queries</text></g><rect x="38" y="145" width="524" height="345" rx="8" fill="#fcfbf7" stroke="#d4d8ce"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#315f55"/></marker></defs><line x1="258.8" y1="293.3" x2="154.3" y2="230.6" stroke="#315f55" stroke-width="2" marker-end="url(#a)"/><rect x="154.0" y="250.9" width="105.2" height="22" rx="11" fill="#f3f1eb" stroke="#d4d8ce"/><text x="206.6" y="265.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing=".5" fill="#315f55">PERFORMED_BY</text><line x1="341.2" y1="293.3" x2="445.7" y2="230.6" stroke="#315f55" stroke-width="2" marker-end="url(#a)"/><rect x="348.4" y="250.9" width="90.0" height="22" rx="11" fill="#f3f1eb" stroke="#d4d8ce"/><text x="393.4" y="265.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing=".5" fill="#315f55">BELONGS_TO</text><line x1="300.0" y1="366.0" x2="300.0" y2="415.0" stroke="#315f55" stroke-width="2" marker-end="url(#a)"/><rect x="258.8" y="379.5" width="82.4" height="22" rx="11" fill="#f3f1eb" stroke="#d4d8ce"/><text x="300.0" y="394.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing=".5" fill="#315f55">HAS_GENRE</text><circle cx="120" cy="210" r="40" fill="#e6ece4" stroke="#315f55" stroke-width="1.5"/><text x="120" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#19201c">Artist</text><circle cx="480" cy="210" r="40" fill="#e6ece4" stroke="#315f55" stroke-width="1.5"/><text x="480" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#19201c">Album</text><circle cx="300" cy="455" r="40" fill="#e6ece4" stroke="#315f55" stroke-width="1.5"/><text x="300" y="460" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#19201c">Genre</text><circle cx="300" cy="318" r="48" fill="#315f55"/><text x="300" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#fff">Track</text><g font-family="Arial, Helvetica, sans-serif"><rect x="582" y="145" width="280" height="160" rx="8" fill="#e6ece4"/><text x="604" y="178" font-size="12" font-weight="700" letter-spacing="1" fill="#315f55">QUERY ANALYSIS</text><text x="604" y="232" font-size="44" font-weight="700" fill="#19201c">7</text><text x="604" y="262" font-size="15" fill="#535e56">Cypher query tasks</text><text x="604" y="284" font-size="15" fill="#535e56">10 runtime trials each</text><rect x="582" y="325" width="280" height="165" rx="8" fill="#e6ece4"/><text x="604" y="358" font-size="12" font-weight="700" letter-spacing="1" fill="#315f55">DATA PREPARATION</text><text x="604" y="398" font-size="18" font-weight="700" fill="#19201c">4 entity types</text><text x="604" y="426" font-size="15" fill="#535e56">Duplicate track IDs resolved</text><text x="604" y="448" font-size="15" fill="#535e56">Multi-artist fields split</text><text x=